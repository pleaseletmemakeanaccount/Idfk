<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ERNAS — inverted cylinder engine</title>
<style>
  :root {
    --bg: #07080b;
    --panel: rgba(9, 11, 16, 0.88);
    --line: rgba(120, 150, 190, 0.22);
    --ink: #c7d3e2;
    --dim: #78889c;
    --hot: #ffcf7a;
    --err: #ff8f7a;
    --ok: #8fe0b0;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
  }

  #gl {
    display: block;
    width: 100%; height: 100%;
    /* The canvas is the whole viewport; nothing scrolls. */
    touch-action: none;
  }

  .hidden { display: none !important; }

  /* ---------------- pause / boot overlay ---------------- */

  #overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 45%, rgba(18, 24, 36, 0.82), rgba(4, 5, 8, 0.96));
    backdrop-filter: blur(3px);
    z-index: 10;
  }

  #overlay-inner {
    max-width: 620px;
    width: min(92vw, 620px);
    padding: 26px 28px 22px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  }

  h1 {
    margin: 0 0 2px;
    font-size: 20px;
    letter-spacing: 0.32em;
    font-weight: 600;
    color: var(--hot);
  }

  #overlay h2 {
    margin: 0 0 18px;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--dim);
    font-weight: 400;
    text-transform: uppercase;
  }

  #overlay-body { line-height: 1.7; color: var(--dim); }
  #overlay-body .ok   { color: var(--ok); }
  #overlay-body .err  { color: var(--err); white-space: pre-wrap; }
  #overlay-body .hint { color: var(--ink); }

  #boot {
    margin-top: 18px;
    padding: 9px 20px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--hot);
    border: 0;
    border-radius: 5px;
    cursor: pointer;
  }
  #boot:hover:not(:disabled) { filter: brightness(1.12); }
  #boot:disabled { opacity: 0.4; cursor: default; }

  /* ---------------- HUD ---------------- */

  #hud {
    position: fixed;
    top: 12px; left: 12px;
    z-index: 5;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: rgba(6, 8, 12, 0.62);
    pointer-events: none;
    line-height: 1.55;
    min-width: 250px;
  }

  #hud .k { display: inline-block; min-width: 152px; color: var(--dim); }
  #hud .v { color: var(--ink); }

  /* crosshair */
  #cross {
    position: fixed; left: 50%; top: 50%;
    width: 3px; height: 3px;
    margin: -1.5px 0 0 -1.5px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.55);
    z-index: 4;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div id="cross" class="hidden"></div>
<div id="hud" class="hidden"></div>

<div id="overlay">
  <div id="overlay-inner">
    <h1>ERNAS</h1>
    <h2>inverted-cylinder voxel engine &mdash; engine base</h2>
    <div id="overlay-body">
      <div>loading module&hellip;</div>
    </div>
    <button id="boot" type="button">Enter the tube</button>
  </div>
</div>

<script type="module">
  /*
   * The boot button starts the engine; this shim only swaps the placeholder
   * line and reveals the HUD once the module has actually parsed.  If the
   * module fails to load (no WebGL2, a syntax error) that placeholder stays up
   * instead of a blank black page with no explanation.
   */
  const body = document.getElementById("overlay-body");
  body.innerHTML = "";
  document.getElementById("hud").classList.remove("hidden");
  document.getElementById("cross").classList.remove("hidden");

  try {
    await import("./src/main.js");
  } catch (err) {
    const d = document.createElement("div");
    d.className = "err";
    d.textContent = "FATAL: " + (err && err.message ? err.message : String(err));
    body.appendChild(d);
    const s = document.createElement("div");
    s.className = "err";
    s.textContent = String(err && err.stack ? err.stack : "");
    body.appendChild(s);
    document.getElementById("boot").disabled = true;
    throw err;
  }
</script>

</body>
</html>
